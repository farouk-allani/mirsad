packages:
  - "packages/*"
  - "apps/*"
  - "v2/packages/*"

# tsx ships esbuild, which needs its postinstall to place the platform binary.
onlyBuiltDependencies:
  - esbuild
  # Hardhat's crypto deps build native bindings; without these, signing and
  # hashing fall back to slow JS or fail outright.
  - keccak
  - secp256k1
